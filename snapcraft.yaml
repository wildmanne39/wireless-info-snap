name: wireless-info
base: core24
version: '0.1'
summary: Gathers essential wireless information needed to troubleshoot wireless issues
description: |
  This script gathers the info necessary for troubleshooting a wireless
  connection and saves them in a text file.

grade: devel
confinement: devmode

apps:
  wireless-info:
    command: bin/wireless-info
    plugs:
      - network
      - network-observe
      - system-observe
      - hardware-observe

parts:
  wireless-script:
    plugin: nil
    source: .
    build-packages:
      - wget
    stage-packages:
      - pciutils        # Provides lspci
      - usbutils        # Provides lsusb
      - iw              # Provides iw
      - wireless-tools  # Provides iwconfig, iwlist
      - net-tools       # Provides ifconfig, route
      - lsb-release     # Provides lsb_release
      - mokutil         # Provides mokutil
      - pcmciautils     # Provides pccardctl
      - dkms            # Provides dkms
    override-build: |
      wget https://raw.githubusercontent.com/UbuntuForums/wireless-info/master/wireless-info
      install -D -m 755 wireless-info ${CRAFT_PART_INSTALL}/bin/wireless-info
