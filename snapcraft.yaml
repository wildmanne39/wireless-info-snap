name: wireless-info
base: core24
version: '2.0'
summary: Comprehensive wireless diagnostic script for Ubuntu systems
description: |
  A modernized diagnostic utility designed to gather detailed hardware, driver, 
  network manager, and configuration information for wireless troubleshooting.

grade: stable
confinement: strict

platforms:
  amd64:

apps:
  wireless-info:
    command: bin/wireless-info
    plugs:
      - network
      - network-observe
      - hardware-observe
      - kernel-modules-observe
      - system-observe
      - mount-observe
      - process-control
      - system-host-configs
      - network-manager-configs

plugs:
  system-host-configs:
    interface: system-files
    read:
      - /etc/netplan
      - /etc/network
      - /etc/resolv.conf
      - /etc/timezone
      - /etc/rc.local
      - /var/lib/dkms

  network-manager-configs:
    interface: system-files
    read:
      - /etc/NetworkManager
      - /var/lib/NetworkManager

parts:
  wireless-info:
    plugin: dump
    source: .
    override-build: |
      # Install dependencies including wget
      apt update
      apt install -y wget iw pciutils usbutils iproute2 net-tools network-manager dkms kmod pastebinit procps
      
      # Create the bin directory in the package structure
      mkdir -p ${CRAFT_PART_INSTALL}/bin
      
      # Download the official wireless-info script directly from the Ubuntu Forums GitHub source
      wget -O ${CRAFT_PART_INSTALL}/bin/wireless-info https://github.com/UbuntuForums/wireless-info/raw/master/wireless-info
      
      # Make the downloaded script executable
      chmod +x ${CRAFT_PART_INSTALL}/bin/wireless-info
