name: wireless-info
base: core24
version: '0.1'
summary: Gathers essential wireless information needed to troubleshoot wireless issues
description: |
  This script gathers the info necessary for troubleshooting a wireless
  connection and saves them in a text file.

grade: devel
confinement: devmode

apps:
  wireless-info:
    command: bin/wireless-info
    environment:
      PATH: $SNAP/usr/sbin:$SNAP/sbin:$SNAP/usr/bin:$SNAP/bin:$PATH
    plugs:
      - network
      - network-observe
      - system-observe
      - hardware-observe
      - removable-media

parts:
  wireless-script:
    plugin: nil
    source: .
    build-packages:
      - curl
    stage-packages:
      - pciutils
      - usbutils
      - iw
      - wireless-tools
      - net-tools
      - lsb-release
      - mokutil
      - network-manager
      - dkms
    override-build: |
      set -e
      
      # Download the official script securely
      curl -L -o wireless-info https://raw.githubusercontent.com/UbuntuForums/wireless-info/master/wireless-info
      
      # Patch release files only if they exist in the script to prevent build crashes
      if grep -q "/etc/os-release" wireless-info; then
        sed -i 's|/etc/os-release|/var/lib/snapd/hostfs/etc/os-release|g' wireless-info
      fi
      if grep -q "/etc/lsb-release" wireless-info; then
        sed -i 's|/etc/lsb-release|/var/lib/snapd/hostfs/etc/lsb-release|g' wireless-info
      fi
      
      # Install into the final snap package
      install -D -m 755 wireless-info ${CRAFT_PART_INSTALL}/bin/wireless-info
