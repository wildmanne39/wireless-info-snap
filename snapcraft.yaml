name: wireless-info
base: core24
version: '2.0'
summary: Comprehensive wireless diagnostic script for Ubuntu systems
description: |
  A modernized diagnostic utility designed to gather detailed hardware, driver, 
  network manager, and configuration information for wireless troubleshooting.

grade: stable
confinement: strict

platforms:
  amd64:

apps:
  wireless-info:
    command: bin/wireless-info
    plugs:
      - network
      - network-observe
      - hardware-observe
      - kernel-modules-observe
      - system-observe
      - mount-observe
      - process-control
      - system-host-configs
      - network-manager-configs

plugs:
  system-host-configs:
    interface: system-files
    read:
      - /etc/netplan
      - /etc/network
      - /etc/resolv.conf
      - /etc/timezone
      - /etc/rc.local
      - /var/lib/dkms

  network-manager-configs:
    interface: system-files
    read:
      - /etc/NetworkManager
      - /var/lib/NetworkManager

parts:
  wireless-info:
    plugin: nil
    stage-packages:
      - pciutils
      - usbutils
      - iw
      - iproute2
      - net-tools
      - network-manager
      - dkms
      - kmod
      - pastebinit
      - procps
    override-build: |
      # Install wget to fetch the script
      apt update
      apt install -y wget
      
      # Create the bin directory inside the snap package
      mkdir -p ${CRAFT_PART_INSTALL}/bin
      
      # Download the official wireless-info script directly during the build
      wget -O ${CRAFT_PART_INSTALL}/bin/wireless-info https://github.com/UbuntuForums/wireless-info/raw/master/wireless-info
      
      # Make it executable
      chmod +x ${CRAFT_PART_INSTALL}/bin/wireless-info
