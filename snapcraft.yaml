name: wireless-info
base: core24
version: '2.0'
summary: Comprehensive wireless diagnostic script for Ubuntu systems
description: |
  A modernized diagnostic utility designed to gather detailed hardware, driver, 
  network manager, and configuration information for wireless troubleshooting.

grade: stable
confinement: strict

platforms:
  amd64:

apps:
  wireless-info:
    command: bin/wireless-info
    plugs:
      - network
      - network-observe
      - hardware-observe
      - kernel-modules-observe
      - system-observe
      - mount-observe
      - process-control
      - system-host-configs
      - network-manager-configs

plugs:
  system-host-configs:
    interface: system-files
    read:
      - /etc/netplan
      - /etc/network
      - /etc/resolv.conf
      - /etc/timezone
      - /etc/rc.local
      - /var/lib/dkms

  network-manager-configs:
    interface: system-files
    read:
      - /etc/NetworkManager
      - /var/lib/NetworkManager

parts:
  wireless-info:
    plugin: nil
    stage-packages:
      - pciutils
      - usbutils
      - iw
      - iproute2
      - net-tools
      - network-manager
      - dkms
      - kmod
      - pastebinit
      - procps
      - rfkill
      - wireless-tools
      - mokutil
    override-build: |
      # Install wget to fetch the script from upstream
      apt update
      apt install -y wget
      
      # Create necessary directories inside the snap package
      mkdir -p ${CRAFT_PART_INSTALL}/bin
      mkdir -p ${CRAFT_PART_INSTALL}/usr/bin
      
      # Download the official wireless-info script directly during the build
      wget -O ${CRAFT_PART_INSTALL}/bin/wireless-info https://github.com/UbuntuForums/wireless-info/raw/master/wireless-info
      
      # Make the script executable
      chmod +x ${CRAFT_PART_INSTALL}/bin/wireless-info

      # Create a lightweight shell-based lsb_release replacement
      cat << 'EOF' > ${CRAFT_PART_INSTALL}/usr/bin/lsb_release
      #!/bin/sh
      if [ -f /etc/os-release ]; then
          . /etc/os-release
      fi
      if [ $# -eq 0 ]; then
          echo "No LSB modules are available."
          exit 0
      fi
      for arg in "$@"; do
          case "$arg" in
              -a|--all)
                  echo "Distributor ID:\t${ID:-Ubuntu}"
                  echo "Description:\t${PRETTY_NAME:-Ubuntu}"
                  echo "Release:\t${VERSION_ID:-24.04}"
                  echo "Codename:\t${VERSION_CODENAME:-noble}"
                  exit 0
                  ;;
              -i|--id) echo "Distributor ID:\t${ID:-Ubuntu}";;
              -d|--description) echo "Description:\t${PRETTY_NAME:-Ubuntu}";;
              -r|--release) echo "Release:\t${VERSION_ID:-24.04}";;
              -c|--codename) echo "Codename:\t${VERSION_CODENAME:-noble}";;
          esac
      done
      EOF
      chmod +x ${CRAFT_PART_INSTALL}/usr/bin/lsb_release
