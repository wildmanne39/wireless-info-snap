name: wireless-info
base: core24
version: '0.1'
summary: Gathers essential wireless information needed to troubleshoot wireless issues
description: |
  This script gathers the info necessary for troubleshooting a wireless
  connection and saves them in a text file.

grade: devel
confinement: devmode

apps:
  wireless-info:
    command: bin/wireless-info
    plugs:
      - network
      - network-observe
      - system-observe
      - hardware-observe
      - removable-media

layout:
  /usr/sbin/lspci:
    symlink: $SNAP/usr/bin/lspci
  /usr/sbin/lsusb:
    symlink: $SNAP/usr/bin/lsusb
  /sbin/ifconfig:
    symlink: $SNAP/sbin/ifconfig
  /sbin/route:
    symlink: $SNAP/sbin/route

parts:
  wireless-script:
    plugin: nil
    source: .
    build-packages:
      - wget
    stage-packages:
      - pciutils
      - usbutils
      - iw
      - wireless-tools
      - net-tools
      - lsb-release
      - mokutil
      - pcmciautils
      - dkms
    override-build: |
      wget https://raw.githubusercontent.com/UbuntuForums/wireless-info/master/wireless-info
      
      # Tell the script to read the host's release files instead of the base snap's files
      sed -i 's|/etc/os-release|/var/lib/snapd/hostfs/etc/os-release|g' wireless-info
      sed -i 's|/etc/lsb-release|/var/lib/snapd/hostfs/etc/lsb-release|g' wireless-info
      
      install -D -m 755 wireless-info ${CRAFT_PART_INSTALL}/bin/wireless-info
