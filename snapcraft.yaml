name: wireless-info
base: core26
version: '2.13'
license: GPL-3.0+
summary: Comprehensive wireless diagnostic script for Linux systems
description: |
  A modernized diagnostic utility designed to gather detailed hardware, driver,
  network manager, and configuration information for wireless troubleshooting.

grade: stable
confinement: strict

platforms:
  amd64:

layout:
  /usr/share/misc/pci.ids:
    bind-file: $SNAP/usr/share/misc/pci.ids
  /usr/share/misc/usb.ids:
    bind-file: $SNAP/usr/share/misc/usb.ids

plugs:
  etc-netplan:
    interface: system-files
    read:
      - /etc/netplan
      - /run/netplan
      - /var/lib/snapd/hostfs/lib/netplan
      - /var/lib/snapd/hostfs/usr/lib/netplan
  etc-network-cfg:
    interface: system-files
    read:
      - /etc/network
      - /etc/modprobe.d
      - /etc/modprobe.conf
      - /etc/udev/rules.d
      - /etc/iwd
      - /etc/sysconfig/network
  etc-networkmanager:
    interface: system-files
    read:
      - /etc/NetworkManager/NetworkManager.conf
      - /etc/NetworkManager/conf.d
      - /var/lib/snapd/hostfs/usr/lib/NetworkManager/conf.d
      - /var/lib/snapd/hostfs/var/lib/NetworkManager/NetworkManager.state
  hostfs-dkms:
    interface: system-files
    read:
      - /var/lib/snapd/hostfs/var/lib/dkms
      - /var/lib/snapd/hostfs/var/cache/akmods
  hostfs-systemd-sleep:
    interface: system-files
    read:
      - /etc/systemd/system-sleep
      - /var/lib/snapd/hostfs/lib/systemd/system-sleep
      - /var/lib/snapd/hostfs/usr/lib/systemd/system-sleep
  sys-efi-secureboot:
    interface: system-files
    read:
      - /sys/firmware/efi/efivars/SecureBoot-8be4df61-93ca-11d2-aa0d-00e098032b8c
      - /sys/firmware/efi/efivars/MokSBStateRT-605dab50-e046-4300-abb6-3dd810dd8b23

apps:
  wireless-info:
    command: bin/wireless-info-wrapper
    plugs:
      - network
      - network-observe
      - network-manager-observe
      - hardware-observe
      - system-observe
      - log-observe
      - kernel-module-observe
      - home
      - etc-netplan
      - etc-network-cfg
      - etc-networkmanager
      - hostfs-dkms
      - hostfs-systemd-sleep
      - sys-efi-secureboot

parts:
  wireless-info:
    plugin: nil
    source: https://github.com/UbuntuForums/wireless-info.git
    source-type: git
    source-branch: master
    source-depth: 1
    stage-packages:
      - pciutils
      - pci.ids
      - usbutils
      - usb.ids
      - iw
      - iproute2
      - network-manager
      - dkms
      - kmod
      - procps
      - util-linux
      - mokutil
      - curl
      - netcat-openbsd
      - systemd
    override-build: |
      mkdir -p "${CRAFT_PART_INSTALL}/bin"
      install -m 0755 "${CRAFT_PART_SRC}/wireless-info" "${CRAFT_PART_INSTALL}/bin/wireless-info"

      cat << EOF > "${CRAFT_PART_INSTALL}/bin/wireless-info-wrapper"
      #!/bin/sh
      ARCH_LIB="\$SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}"
      export PATH="\$SNAP/bin:\$SNAP/usr/sbin:\$SNAP/usr/bin:\$SNAP/sbin:\$PATH"
      export LD_LIBRARY_PATH="\$ARCH_LIB/systemd:\$ARCH_LIB:\$SNAP/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}"
      exec "\$SNAP/bin/wireless-info" "\$@"
      EOF
      chmod 0755 "${CRAFT_PART_INSTALL}/bin/wireless-info-wrapper"
