name: Build Snap

'on':
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install and Initialize LXD Natively
        run: |
          sudo snap install lxd
          sudo lxd waitready
          sudo lxd init --auto

      - name: Install Snapcraft
        run: |
          sudo snap install snapcraft --classic

      - name: Pack snap using LXD container
        run: |
          sudo snapcraft pack --use-lxd

      - name: Upload generated snap
        uses: actions/upload-artifact@v4
        with:
          name: wireless-info-snap
          path: '*.snap'
