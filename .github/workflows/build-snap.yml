name: Build Snap

'on':
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build snap
        uses: snapcore/action-build@v1

      - name: Upload generated snap
        uses: actions/upload-artifact@v4
        with:
          name: wireless-info-snap
          path: '*.snap'
